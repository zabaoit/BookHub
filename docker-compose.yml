services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookhub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      FRONTEND_URL: http://localhost:5173
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
